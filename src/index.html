<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emergensee-AI</title>
<meta name="dicoding:email" content="nurmayadiliana@gmail.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
--primary:#2563eb;--bg:#f8fafc;--card:#ffffff;
--text:#1e293b;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;
}
body{font-family:Inter,sans-serif;margin:0;background:var(--bg);color:var(--text);padding-bottom:90px}
.app-bar{background:var(--primary);color:white;padding:1rem;text-align:center;font-weight:800;position:sticky;top:0;z-index:1000;display:flex;justify-content:center;align-items:center;gap:8px}
.container{max-width:500px;margin:0 auto;padding:1rem}
.card{background:var(--card);border-radius:1.25rem;padding:1.25rem;margin-bottom:1rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border:1px solid #e2e8f0}
.status-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.badge{padding:.5rem 1rem;border-radius:9999px;font-size:.75rem;font-weight:800;color:white}
#map{height:250px;width:100%;border-radius:1rem;margin:10px 0;z-index:1;border:1px solid #ddd}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:1rem}
.weather-item{background:#f1f5f9;padding:.75rem;border-radius:.75rem;font-size:.8rem;display:flex;align-items:center;gap:8px;font-weight:600}
.ai-section{background:#f8fafc;border-radius:1rem;padding:1rem;margin-top:1rem;border:1px dashed #cbd5e1;min-height:50px;font-size:.9rem;line-height:1.6}
.input-group{display:flex;gap:.5rem;margin-top:1rem}
input{flex:1;padding:.75rem;border:1px solid #d1d5db;border-radius:.75rem;outline:none}
.btn{background:var(--primary);color:white;border:none;padding:.75rem 1rem;border-radius:.75rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.emergency-bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px;box-shadow:0 -5px 15px rgba(0,0,0,.08);z-index:1001;display:flex;gap:10px}
.btn-danger{background:var(--danger);flex:2;font-weight:800;animation:pulse 2s infinite;height:55px}
.leaflet-routing-container{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:none;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
#splash {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity .6s ease, visibility .6s;
}

#splash.hide {
  opacity: 0;
  visibility: hidden;
}

.splash-box {
  text-align: center;
  color: #fff;
}

.logo {
  font-size: 64px;
}

/* @keyframes pulse {
  0% { transform: scale(1); opacity: 1 }
  50% { transform: scale(1.1); opacity: .7 }
  100% { transform: scale(1); opacity: 1 }
} */
</style>
</head>

<body>
<div id="splash">
  <div class="splash-box">
    <div class="logo">🛡️</div>
    <h1>EmergenSee-AI</h1>
    <p>Initializing safety system...</p>
  </div>
</div>

<div class="app-bar"><i data-lucide="shield-alert"></i> EmergenSee-AI</div>

<div class="container">
<div class="card">
<div class="status-header">
<span style="font-weight:700;color:#64748b;font-size:.7rem">ENVIRONMENTAL ANALYTICS</span>
<div id="risk-badge" class="badge" style="background:#94a3b8">MENGANALISIS...</div>
</div>
<div id="loc-name" style="font-size:1.2rem;font-weight:800;color:var(--primary)">Mencari Lokasi...</div>

<div class="weather-grid">
<div class="weather-item"><i data-lucide="thermometer" size="16"></i><span id="w-temp">--°C</span></div>
<div class="weather-item"><i data-lucide="wind" size="16"></i><span id="w-wind">-- km/h</span></div>
<div class="weather-item"><i data-lucide="eye" size="16"></i><span id="w-vis">-- km</span></div>
<div class="weather-item"><i data-lucide="gauge" size="16"></i><span id="w-pres">-- hPa</span></div>
</div>
</div>

<div class="card">
<div style="display:flex;align-items:center;gap:5px;margin-bottom:10px">
<i data-lucide="map-pin" size="18" color="var(--primary)"></i>
<h3 style="margin:0;font-size:.9rem">Jalur Evakuasi ke Shelter</h3>
</div>
<div id="map"></div>
</div>

<div class="card">
<div style="display:flex;align-items:center;gap:5px">
<i data-lucide="cpu" size="18" color="var(--primary)"></i>
<h3 style="margin:0;font-size:.9rem">Sistem Respon Otomatis</h3>
</div>
<div id="ai-output" class="ai-section">
<span style="color:#94a3b8">Menunggu data lingkungan untuk analisis...</span>
</div>
<div class="input-group">
<input type="text" id="user-msg" placeholder="Ada keluhan medis?">
<button class="btn" onclick="processAI()">
<div id="load-ai" class="spinner"></div>
<span id="btn-txt">Tanya</span>
</button>
</div>
</div>
</div>

<div class="emergency-bar">
<button class="btn btn-danger" onclick="triggerUrgent()">
<i data-lucide="zap"></i> SAYA TERLUKA
</button>
<button class="btn" style="background:#1e293b;flex:1" onclick="window.location.href='tel:112'">
<i data-lucide="phone-call"></i> 112
</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
lucide.createIcons()

let map,userCoords=[-7.2575,112.7521],weatherCtx=""

async function getAddress(lat,lon){
try{
const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
const data=await res.json()
return data.address.village||data.address.suburb||data.address.city||data.address.town||"Lokasi Terdeteksi"
}catch{return"Area Aktif"}
}

async function initSystem(){

  navigator.geolocation.getCurrentPosition(async pos=>{
    const { latitude, longitude } = pos.coords
    userCoords=[latitude,longitude]

    document.getElementById('loc-name').innerText =
      await getAddress(latitude,longitude)

    if(!map){
      map=L.map('map',{zoomControl:false}).setView(userCoords,16)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png')
        .addTo(map)

      const shelter=L.latLng(latitude+.003,longitude+.002)

      L.Routing.control({
        waypoints:[L.latLng(latitude,longitude),shelter],
        lineOptions:{styles:[{color:'#2563eb',weight:6,opacity:.8}]},
        createMarker:()=>null,
        addWaypoints:false,
        draggableWaypoints:false,
        fitSelectedRoutes:true,
        show:false
      }).addTo(map)

      L.circleMarker(userCoords,{color:'#2563eb',radius:7,fillOpacity:.9}).addTo(map)
      L.marker(shelter).addTo(map)
    }

    await fetchWeather(latitude,longitude);
    await autoAIAnalysis();
    setInterval(()=>fetchWeather(latitude,longitude),60000);

  })
}


async function fetchWeather(lat,lon){
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,surface_pressure,weather_code,visibility,wind_speed_10m&timezone=auto&_=${Date.now()}`)
const data=await res.json()
const cur=data.current
document.getElementById('w-temp').innerText=`${cur.temperature_2m}°C`
document.getElementById('w-wind').innerText=`${cur.wind_speed_10m} km/h`
document.getElementById('w-vis').innerText=`${(cur.visibility/1000).toFixed(1)} km`
document.getElementById('w-pres').innerText=`${Math.round(cur.surface_pressure)} hPa`
weatherCtx=`Suhu ${cur.temperature_2m}C, Angin ${cur.wind_speed_10m}km/h, Jarak Pandang ${(cur.visibility/1000).toFixed(1)}km`
evaluateHazard(cur)
}

function evaluateHazard(cur){
const b=document.getElementById('risk-badge')
let risk="AMAN",color="var(--success)"
if(cur.wind_speed_10m>25||cur.weather_code>=95){risk="BAHAYA TINGGI";color="var(--danger)"}
else if(cur.wind_speed_10m>15||cur.visibility<2000){risk="WASPADA RAWAN";color="var(--warning)"}
b.innerText=risk
b.style.background=color
}

async function processAI(){
const msg=document.getElementById('user-msg').value
if(!msg)return
const out=document.getElementById('ai-output')
document.getElementById('load-ai').style.display='block'
document.getElementById('btn-txt').style.display='none'

const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${AI_CORE_KEY}`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({contents:[{parts:[{text:`[SISTEM DARURAT] ${weatherCtx}. ${msg}. Berikan 3 instruksi keselamatan tanpa markdown.`}]}]})
})
const data=await res.json()
let raw=data.candidates[0].content.parts[0].text
raw=raw.replace(/\*\*/g,'').replace(/^\d+\.\s*/gm,'').replace(/^-+\s*/gm,'').trim()
out.innerHTML=raw.split('\n').filter(l=>l.trim()).map(l=>`<div>• ${l}</div>`).join('')
document.getElementById('load-ai').style.display='none'
document.getElementById('btn-txt').style.display='block'
}

function triggerUrgent(){window.location.href='index2'}

window.onload=initSystem
document.addEventListener('keydown', function (e) {
    if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U')
    ) {
        e.preventDefault();
        alert("Akses Developer Tools dilarang di Aplikasi ini");
        return false;
    }
});

async function autoAIAnalysis(){
  const out = document.getElementById('ai-output');

  out.innerHTML = "<span style='color:#94a3b8'>Menganalisis kondisi lingkungan...</span>";

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${AI_CORE_KEY}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `[SISTEM DARURAT]
            Data lingkungan saat ini: ${weatherCtx}.
            Berikan 3 instruksi keselamatan awal untuk masyarakat umum.
            Tanpa markdown.`
          }]
        }]
      })
    }
  );

  const data = await res.json();
  let raw = data.candidates[0].content.parts[0].text;

  raw = raw
    .replace(/\*\*/g,'')
    .replace(/^\d+\.\s*/gm,'')
    .replace(/^-+\s*/gm,'')
    .trim();

  out.innerHTML = raw
    .split('\n')
    .filter(l => l.trim())
    .map(l => `<div>• ${l}</div>`)
    .join('');
}


document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
});

setInterval(function() {
    const threshold = 160;
    const isDevToolsOpen = 
        window.outerWidth - window.innerWidth > threshold || 
        window.outerHeight - window.innerHeight > threshold;
    
    if (isDevToolsOpen) {
        document.body.style.filter = "blur(10px)";
        document.body.style.pointerEvents = "none";
    } else {
        document.body.style.filter = "none";
        document.body.style.pointerEvents = "all";
    }
}, 1000);
</script>
<script>
  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("splash").classList.add("hide")
    }, 2000)
  })
</script>

</body>

</html>
